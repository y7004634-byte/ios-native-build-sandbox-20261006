name: DoorMap581Native
options:
  minimumXcodeGenVersion: 2.41.0
  developmentLanguage: zh-Hant
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.door581.appletest
    TARGETED_DEVICE_FAMILY: "1"
targets:
  DoorMap581:
    type: application
    platform: iOS
    sources:
      - path: DoorMap581
        excludes:
          - Info.plist
          - Behavior
          - MiniMap
          - NativeData
          - SceneDelegate.swift
          - AppleSearchBridge.swift
          - DoorMapViewController.swift
          - LocationBridge.swift
          - NativeBridge.swift
          - NativeMemoryProfile.swift
          - NLSCMiniMapView.swift
          - RestoredAppleMapViewController.swift
          - NativeControlsWebView.swift
          - NativeBundleServer.swift
          - NativeAppleMapViewController.swift
      - path: NativeOnlyBuild/SceneDelegate.swift
      - path: NativeOnlyBuild/Resources/Behavior
        type: folder
        buildPhase: resources
      - path: NativeOnlyBuild/Resources/NativeData
        type: folder
        buildPhase: resources
      - path: NativeOnlyBuild/Resources/battery-stations-fallback.json
        buildPhase: resources
    dependencies:
      - sdk: libz.tbd
    settings:
      base:
        INFOPLIST_FILE: NativeOnlyBuild/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_MODULE_NAME: DoorMap581
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      gatherCoverageData: false
